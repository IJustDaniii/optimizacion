# Publica una release con el instalador al subir una etiqueta vX.Y.Z.
# Para activarlo: copia este archivo a .github/workflows/release.yml (hace falta un token con el permiso "workflow").
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que la etiqueta coincide con la versión del código
        shell: pwsh
        run: |
          $v = (Select-String -Path src/optiwin/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con __version__ = $v" }
      - run: pip install -e ".[build,dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - run: python packaging/build.py
      - name: Crear la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/OptiWin-Setup-*.exe dist/OptiWin-Setup-*.exe.sha256 --title "OptiWin ${{ github.ref_name }}" --generate-notes
